server:
  port: 8084

spring:
  application:
    name: rag-service

management:
  endpoints:
    web:
      exposure:
        include: health,info

etherm:
  services:
    ingestion: ${ETHERM_INGESTION_URL:http://localhost:8081}
    retrieval: ${ETHERM_RETRIEVAL_URL:http://localhost:8083}
  phrasing:
    # template | claude (claude needs ANTHROPIC_API_KEY; numbers always come from Java)
    provider: ${ETHERM_PHRASING:template}
    model: claude-opus-5-5
  query:
    # Fix "today" for relative periods such as "last quarter"; empty means the real date.
    as-of: ${ETHERM_AS_OF:}
