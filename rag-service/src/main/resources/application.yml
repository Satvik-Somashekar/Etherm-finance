server:
  port: 8084

spring:
  application:
    name: rag-service

management:
  endpoints:
    web:
      exposure:
        include: health,info

etherm:
  services:
    ingestion: ${ETHERM_INGESTION_URL:http://localhost:8081}
    retrieval: ${ETHERM_RETRIEVAL_URL:http://localhost:8083}
  phrasing:
    # template | claude | gemini (needs ANTHROPIC_API_KEY or GEMINI_API_KEY; numbers always come from Java)
    provider: ${ETHERM_PHRASING:template}
    model: claude-opus-5-5
    gemini-model: ${ETHERM_GEMINI_MODEL:gemini-3.5-flash}
  query:
    # Fix "today" for relative periods such as "last quarter"; empty means the real date.
    as-of: ${ETHERM_AS_OF:}

  security:
    auth-key: ${ETHERM_AUTH_KEY:}
    require-key: ${ETHERM_REQUIRE_AUTH_KEY:false}
    # Requests per minute per customer: the chat can call a paid model several times per question.
    # The evaluation asks hundreds of questions per customer, so it runs with these set to 0 (no limit).
    rate-limits:
      "[/api/chat]": ${ETHERM_CHAT_RATE_LIMIT:20}
      "[/api/query]": ${ETHERM_QUERY_RATE_LIMIT:60}
      "[/**]": 300
