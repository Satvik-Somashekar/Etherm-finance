# Runs the four backend services on their usual ports with the synthetic data mounted.
# Prerequisites: `mvn clean install` (builds the jars) and the data generator (fills data/synthetic).
# The frontend runs on the host with `npm --prefix frontend run dev`; its proxy targets localhost:8081-8084.
# Ports are published on 127.0.0.1 only, so the services are not reachable from other machines.

# Every service: read-only root filesystem, no Linux capabilities, no privilege escalation, a small /tmp.
x-service: &service
  restart: unless-stopped
  # Every service checks tokens with the same key. Set ETHERM_AUTH_KEY (base64, 32+ bytes, e.g.
  # `openssl rand -base64 32`) in the environment or an .env file; without it a public development key is used.
  environment: &security
    ETHERM_AUTH_KEY: ${ETHERM_AUTH_KEY:-}
  read_only: true
  tmpfs: ["/tmp:size=64m"]
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]

services:
  ingestion:
    <<: *service
    build: { context: ., args: { MODULE: ingestion } }
    ports: ["127.0.0.1:8081:8081"]
    environment:
      <<: *security
      ETHERM_SEED_DIR: /data/synthetic
      ETHERM_DEMO_PASSCODE: ${ETHERM_DEMO_PASSCODE:-etherm-demo}
    volumes:
      - ./data/synthetic:/data/synthetic:ro

  normalization:
    <<: *service
    build: { context: ., args: { MODULE: normalization } }
    ports: ["127.0.0.1:8082:8082"]
    environment:
      <<: *security
      ETHERM_INGESTION_URL: http://ingestion:8081
    depends_on: [ingestion]

  retrieval:
    <<: *service
    build: { context: ., args: { MODULE: retrieval } }
    ports: ["127.0.0.1:8083:8083"]
    environment:
      <<: *security
      ETHERM_INGESTION_URL: http://ingestion:8081
      ETHERM_NORMALIZATION_URL: http://normalization:8082
    depends_on: [ingestion, normalization]

  rag-service:
    <<: *service
    build: { context: ., args: { MODULE: rag-service } }
    ports: ["127.0.0.1:8084:8084"]
    environment:
      <<: *security
      ETHERM_INGESTION_URL: http://ingestion:8081
      ETHERM_RETRIEVAL_URL: http://retrieval:8083
      # Pin "today" so relative periods ("last quarter") land inside the synthetic data window.
      ETHERM_AS_OF: ${ETHERM_AS_OF:-2026-10-25}
      # Set ETHERM_PHRASING=claude and ANTHROPIC_API_KEY to let Claude phrase answers; templates otherwise.
      ETHERM_PHRASING: ${ETHERM_PHRASING:-template}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      # ETHERM_PHRASING=gemini with GEMINI_API_KEY (and optionally ETHERM_GEMINI_MODEL) uses Gemini instead.
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      ETHERM_GEMINI_MODEL: ${ETHERM_GEMINI_MODEL:-gemini-3.5-flash}
    depends_on: [ingestion, retrieval]
